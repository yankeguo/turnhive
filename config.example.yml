# turnhive configuration
# Copy to config.yml and adjust for your environment.

# Address the HTTP server binds to.
listen: ":8080"

node:
  # Unique node identity in the cluster. Leave empty to use
  # "<hostname>-<pid>".
  id: ""
  # Base URL other nodes use to forward session requests to this node.
  # Leave empty to use "http://127.0.0.1:<listen port>"; set it to an
  # address reachable by other nodes in a real deployment.
  advertise: ""

s3:
  # S3-compatible service address. Leave empty for AWS default endpoints.
  # Examples: "s3.us-east-1.amazonaws.com", "minio.example.com", "127.0.0.1:9000"
  endpoint: ""
  region: us-east-1
  bucket: my-bucket
  access_key_id: ""
  secret_access_key: ""
  # Set false for plain-HTTP local services (default true).
  use_ssl: true
  # Use path-style addressing (endpoint/bucket/key). Required by MinIO,
  # RustFS and many on-premise S3-compatible services.
  force_path_style: false
  # Object key prefix, allows sharing one bucket across projects.
  prefix: turnhive

etcd:
  # At least one endpoint is required; list all cluster members for
  # automatic failover.
  endpoints:
    - "http://127.0.0.1:2379"
  # Timeout for establishing a connection to an endpoint.
  dial_timeout: 5s
  # Leave empty for clusters without auth enabled.
  username: ""
  password: ""
  # Leave empty for plaintext endpoints.
  tls:
    # cert_file and key_file must be set together.
    cert_file: ""
    key_file: ""
    ca_file: ""
  # Key prefix for node and session records, allows sharing one etcd
  # across clusters.
  prefix: turnhive
  # TTL of the lease a node registers itself and its sessions under.
  # A node that crashes or loses its keepalive disappears from the
  # cluster (together with its sessions) after this duration.
  lease_ttl: 10s

ironhive:
  # Base URL of the ironhive controller, which provides the sandboxes
  # sessions execute in. Required.
  url: "http://127.0.0.1:8080"
  # Sandbox lease duration requested at allocation time. A sandbox whose
  # lease expires is destroyed by ironhive. Default 30m.
  lease: 30m
